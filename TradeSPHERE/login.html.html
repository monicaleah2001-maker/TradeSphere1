<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Login - TradeSphere</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8f7f3, #e8f0e8);
            padding: 20px;
        }

        .auth-container {
            width: 430px;
            max-width: 100%;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(38, 50, 56, 0.12);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo a {
            text-decoration: none;
            font-size: 28px;
            font-weight: 800;
            color: #263238;
        }

        .auth-logo span {
            color: #6b8e6b;
        }

        .auth-title {
            text-align: center;
            margin-bottom: 8px;
            color: #263238;
            font-size: 28px;
        }

        .auth-subtitle {
            text-align: center;
            color: #78909c;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #455a64;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d9e2d9;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #6b8e6b;
            box-shadow: 0 0 0 3px rgba(107, 142, 107, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #6b8e6b;
            cursor: pointer;
            font-weight: bold;
        }

        .login-submit {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 10px;
            background: #6b8e6b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-submit:hover {
            background: #4f704f;
            transform: translateY(-2px);
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: #fdecec;
            color: #b33a3a;
        }

        .message.success {
            display: block;
            background: #eaf5ea;
            color: #4f704f;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #78909c;
        }

        .register-link a {
            color: #6b8e6b;
            font-weight: bold;
            text-decoration: none;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #607078;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <div class="auth-logo">
            <a href="index.html">
                Trade<span>Sphere</span>
            </a>
        </div>

        <h1 class="auth-title">Welcome Back</h1>

        <p class="auth-subtitle">
            Login to your user account
        </p>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()">
                        Show
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="login-submit">
                Login
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="create-account.html">
                Create Account
            </a>
        </div>

        <div class="back-home">
            <a href="index.html">
                ← Back to Home
            </a>
        </div>

    </div>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".show-password");

            if (password.type === "password") {

                password.type = "text";
                button.textContent = "Hide";

            } else {

                password.type = "password";
                button.textContent = "Show";

            }

        }


        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value
                    .trim()
                    .toLowerCase();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                const user =
                    JSON.parse(
                        localStorage.getItem("tradesphereUser")
                    );


                if (!user) {

                    message.className = "message error";

                    message.textContent =
                        "No account found. Please create an account first.";

                    return;

                }


                if (
                    email === user.email &&
                    password === user.password
                ) {

                    localStorage.setItem(
                        "tradesphereLoggedIn",
                        "true"
                    );

                    message.className =
                        "message success";

                    message.textContent =
                        "Login successful!";

                    setTimeout(function() {

                        window.location.href =
                            "dashboard.html";

                    }, 800);

                } else {

                    message.className =
                        "message error";

                    message.textContent =
                        "Invalid email or password.";

                }

            });

    </script>

</body>
</html>
